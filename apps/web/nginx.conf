server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed / cached static assets, falling back to index.html so
    # client-side routing (react-router) works on deep links and reloads.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Backend API proxy ---
    # Enable this block once the `backend` service in docker-compose.yml is
    # operational. It forwards /api requests to the Go backend on port 8080,
    # matching the dev proxy in apps/web/vite.config.ts.
    #
    # location /api/ {
    #     proxy_pass http://backend:8080;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
